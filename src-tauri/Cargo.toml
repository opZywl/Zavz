[package]
name = "Zavz"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
dll-syringe = { version = "0.17", default-features = false, features = ["syringe"] }
tokio = { version = "1.37", features = ["sync", "time"] }
tauri = { version = "2.3", features = [] }
tauri-plugin-opener = "2"
dirs = "5.0"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winnt", "errhandlingapi", "wow64apiset", "minwindef", "handleapi", "fileapi", "securitybaseapi", "winbase", "processthreadsapi", "tlhelp32"] }
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Kernel"] }

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
