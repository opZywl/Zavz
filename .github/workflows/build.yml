name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build Application
    strategy:
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-14

      - name: Setup Java headers for the Lunar DLL
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build current FDP Lunar DLL
        shell: pwsh
        run: |
          $taskJava = $env:JAVA_HOME.Replace('\', '/')
          cmake -S native/fdp-lunar -B build/fdp-lunar -A x64 "-DJAVA_HOME:PATH=$taskJava"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/fdp-lunar --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/fdp-lunar/Release/fdp-lunar.dll src/load/fdp-lunar.dll

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: yarn tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Compute ZAVZ SHA-256
        shell: pwsh
        run: ./.github/scripts/zavz-sha256.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zavz-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/ZAVZ.exe
            src-tauri/target/release/SHA256SUMS.txt
            !src-tauri/target/release/bundle/**/*.dSYM
          retention-days: 7
